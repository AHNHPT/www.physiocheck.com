<style>
:root {
  --bg: #04060f;
  --ink: #eef0ff;
  --dim: rgba(238, 240, 255, .66);
  --faint: rgba(238, 240, 255, .42);
  --line: rgba(255, 255, 255, .12);
  --card: rgba(14, 18, 38, .72);
  --card-hi: rgba(36, 40, 78, .78);
  --pink: #ff9ad5;
  --gold: #ffd58a;
  --aqua: #8af2e8;
  --violet: #b8a2ff;
  --ok: #8be3a5;
  --warn: #ffbf7a;
  --radius: 18px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
#cam { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: -10px; top: -10px; }

.screen { position: fixed; inset: 0; display: none; flex-direction: column;
  padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 18px) calc(var(--safe-l) + 18px);
  overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen.on { display: flex; animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

h1, h2, h3, p { margin: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { width: 46px; height: 46px; border-radius: 13px; background-size: cover; box-shadow: 0 0 24px rgba(255, 154, 213, .35); flex: none; }
.brand h1 { font-size: 26px; font-weight: 600; letter-spacing: .04em; }
.brand .sub { font-size: 13px; color: var(--dim); letter-spacing: .03em; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 14px; padding: 8px 13px; }
.lang button.sel { background: var(--card-hi); color: var(--ink); }

.label { font-size: 13px; color: var(--faint); letter-spacing: .08em; margin: 4px 2px -6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

.ex { display: grid; gap: 10px; }
.ex button { appearance: none; text-align: left; display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--line); color: var(--ink); font: inherit; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.ex button .ico { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,.02)); }
.ex button .t { font-size: 18px; font-weight: 600; }
.ex button .d { font-size: 13.5px; color: var(--dim); margin-top: 2px; line-height: 1.35; }
.ex button.sel { border-color: rgba(255, 154, 213, .7); background: linear-gradient(135deg, rgba(255, 154, 213, .16), rgba(138, 242, 232, .07)), var(--card); box-shadow: 0 0 22px rgba(255, 154, 213, .18); }

.seg { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.seg button { appearance: none; flex: 1; border: 0; border-radius: 10px; padding: 12px 6px; background: transparent; color: var(--dim); font: inherit; font-size: 16px; }
.seg button.sel { background: var(--card-hi); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .label { margin-bottom: 4px; }

.plan { font-size: 14px; color: var(--dim); line-height: 1.5; padding: 2px 4px; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 17px 20px; font: inherit; font-size: 19px; font-weight: 600; color: #1a0b1c;
  background: linear-gradient(135deg, #ffc1e4, #ff8fcf 55%, #f6b4ff); box-shadow: 0 8px 30px rgba(255, 143, 207, .35); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-weight: 500; }
.btn.small { padding: 11px 16px; font-size: 15px; }
.links { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--gold); }

.safety li { margin: 0 0 12px 0; line-height: 1.45; font-size: 17px; }
.safety ul { padding-left: 4px; list-style: none; margin: 6px 0 0; }
.safety li::before { content: "✿"; color: var(--pink); margin-right: 10px; }
.note { font-size: 13px; color: var(--faint); line-height: 1.5; }

/* in-game display */
#hud { position: fixed; inset: 0; pointer-events: none; display: none; }
#hud.on { display: block; }
#caption { position: absolute; left: calc(var(--safe-l) + 16px); right: calc(var(--safe-r) + 16px); top: calc(var(--safe-t) + 16px);
  text-align: center; font-size: clamp(24px, 6.4vw, 46px); font-weight: 500; line-height: 1.25; letter-spacing: .02em;
  text-shadow: 0 0 18px rgba(0, 0, 0, .9), 0 0 32px rgba(120, 140, 255, .35); transition: opacity .45s, transform .45s; }
#caption.low { top: auto; bottom: calc(var(--safe-b) + 110px); }
#caption.hide { opacity: 0; transform: translateY(-6px); }
#big { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(64px, 22vw, 150px); font-weight: 200; color: rgba(238, 240, 255, .78);
  text-shadow: 0 0 30px rgba(140, 160, 255, .45); }
#counter { position: absolute; left: calc(var(--safe-l) + 18px); bottom: calc(var(--safe-b) + 22px); font-size: 18px; color: var(--dim); font-variant-numeric: tabular-nums; }
#tag { position: absolute; left: calc(var(--safe-l) + 18px); top: calc(var(--safe-t) + 10px); font-size: 12px; color: var(--faint); letter-spacing: .1em; display: none; }
.hudbtn { position: absolute; pointer-events: auto; appearance: none; border: 1px solid var(--line); background: rgba(10, 14, 30, .55); color: var(--ink);
  border-radius: 999px; font: inherit; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#pauseBtn { right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 14px); width: 56px; height: 56px; font-size: 20px; }
#skipBtn { right: calc(var(--safe-r) + 84px); bottom: calc(var(--safe-b) + 18px); padding: 13px 18px; font-size: 15px; display: none; }

.center { margin: auto 0; }
.big-num { font-size: 52px; font-weight: 300; letter-spacing: .02em; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.stat:last-child { border-bottom: 0; }
.stat span:first-child { color: var(--dim); }
.badge { display: inline-block; padding: 5px 11px; border-radius: 999px; background: rgba(255, 213, 138, .14); color: var(--gold); font-size: 13.5px; margin: 4px 6px 0 0; }


.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { font-size: 12px; color: var(--faint); }
.week i { display: block; margin: 6px auto 0; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); font-style: normal; line-height: 30px; font-size: 15px; }
.week i.done { background: radial-gradient(circle, rgba(255, 154, 213, .55), rgba(255, 154, 213, .08)); border-color: rgba(255, 154, 213, .6); }
.week i.today { box-shadow: 0 0 0 2px rgba(138, 242, 232, .55); }
.hist { font-size: 14.5px; }
.hist .h { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hist .h:last-child { border-bottom: 0; }
.hist .h span:last-child { color: var(--dim); text-align: right; }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aqua), var(--pink)); transition: width .3s; }
#toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 90px); transform: translateX(-50%); background: rgba(20, 24, 48, .92); border: 1px solid var(--line);
  padding: 11px 18px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20; }
#toast.on { opacity: 1; }
@media (min-width: 700px) { .ex { grid-template-columns: 1fr; } #caption { font-size: clamp(30px, 4.6vw, 52px); } }
@media (orientation: landscape) and (max-height: 560px) { .screen { padding-top: calc(var(--safe-t) + 10px); } .brand .logo { width: 38px; height: 38px; } }
</style>

const lerp = (a, b, t) => a + (b - a) * t;

const J = { nose: 0, neck: 1, lS: 2, rS: 3, lE: 4, rE: 5, lW: 6, rW: 7, lH: 8, rH: 9, lK: 10, rK: 11, lA: 12, rA: 13, lT: 14, rT: 15 };
const NJ = 16;
const SIDES = [
  { k: 'left', i: 0, out: -1, S: J.lS, E: J.lE, W: J.lW, H: J.lH, K: J.lK, A: J.lA, T: J.lT },
  { k: 'right', i: 1, out: 1, S: J.rS, E: J.rE, W: J.rW, H: J.rH, K: J.rK, A: J.rA, T: J.rT },
];
const LR_PAIRS = [[J.lS, J.rS], [J.lE, J.rE], [J.lW, J.rW], [J.lH, J.rH], [J.lK, J.rK], [J.lA, J.rA], [J.lT, J.rT]];
const BONES = [[J.lS, J.rS], [J.lS, J.lE], [J.lE, J.lW], [J.lW, J.lT], [J.rS, J.rE], [J.rE, J.rW], [J.rW, J.rT], [J.lS, J.lH], [J.rS, J.rH],
  [J.lH, J.rH], [J.lH, J.lK], [J.lK, J.lA], [J.rH, J.rK], [J.rK, J.rA], [J.neck, J.nose]];

/// The size everything is framed to on screen. The arm (shoulder joint to fingertip, ≈0.44 × height)
/// is as long as the screen's width allows for a full sideways reach, and the reach space (overhead
/// reach to the feet) is centred vertically below the caption area. The demo ghost and the positioning
/// figure use the same body, so a well-placed patient overlaps the ghost exactly.
function stdBody(aspect, posture, lateral = 1) {
  // lateral = furthest sideways reach the exercise asks for, as a fraction of arm length
  const A = clamp((aspect / 2 - 0.075) / (lateral + 0.23), 0.11, 0.30);
  const below = posture === 'sit' ? 1.3 * A : 1.8 * A;
  const shoulderY = Math.max(0.54 - (below - A) / 2, A + 0.17);
  return { A, shoulderY, half: 0.5 * A / 2.2 };
}
const flowerRadius = (std, aspect, size) => Math.max(0.17 * std.A, 0.065 * Math.min(aspect, 1)) * size;

class OneEuro {
  constructor(minCutoff = 1.4, beta = 7, dCutoff = 1.2) { Object.assign(this, { minCutoff, beta, dCutoff }); this.reset(); }
  reset() { this.x = null; this.dx = V(0, 0); this.t = 0; }
  static alpha(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
  filter(p, t) {
    if (!this.x) { this.x = V(p.x, p.y); this.t = t; return this.x; }
    const dt = clamp(t - this.t, 1 / 240, 0.25); this.t = t;
    const raw = V((p.x - this.x.x) / dt, (p.y - this.x.y) / dt);
    const ad = OneEuro.alpha(this.dCutoff, dt);
    this.dx = V(this.dx.x + (raw.x - this.dx.x) * ad, this.dx.y + (raw.y - this.dx.y) * ad);
    const a = OneEuro.alpha(this.minCutoff + this.beta * vlen(this.dx), dt);
    this.x = V(this.x.x + (p.x - this.x.x) * a, this.x.y + (p.y - this.x.y) * a);
    return this.x;
  }
}

/// Mirror mapping between camera-proportional coordinates (x × camAspect, y) and the screen
/// ("wall": height 1, width = aspect, y down). The auto-framer zooms and centres on the patient
/// so their arm appears at the standard size, but only moves while no flower is live.
class Framer {
  constructor() { this.reset(); }
  reset() { this.region = null; this.desired = null; this.moving = false; }
  get settled() { return !this.moving && !!this.region; }
  target(fi, std, exercise, camAspect, wallAspect) {
    const hMax = Math.min(1, camAspect / wallAspect);
    const h = clamp(fi.arm / std.A, 0.35, hMax);
    let top = fi.ms.y - std.shoulderY * h;
    let cx = exercise === 'balance' ? (fi.baseX ?? fi.ms.x) : fi.ms.x;
    const w = h * wallAspect;
    cx = w >= camAspect ? camAspect / 2 : clamp(cx, w / 2 - 0.02, camAspect - w / 2 + 0.02);
    top = clamp(top, -0.02, 1 - h + 0.02);
    return { cx, top, h };
  }
  update(fi, std, exercise, camAspect, wallAspect, dt, allowMove) {
    if (fi) {
      const t = this.target(fi, std, exercise, camAspect, wallAspect);
      if (this.desired) { const k = 1 - Math.exp(-dt / 0.6); for (const key of ['cx', 'top', 'h']) this.desired[key] += (t[key] - this.desired[key]) * k; }
      else this.desired = t;
    }
    const d = this.desired;
    if (!d) return;
    if (!this.region) { if (allowMove) this.region = { ...d }; return; }
    const r = this.region;
    const dh = Math.abs(d.h - r.h) / r.h, dp = Math.max(Math.abs(d.cx - r.cx), Math.abs(d.top - r.top)) / r.h;
    if (!this.moving && (dh > 0.06 || dp > 0.05)) this.moving = true;
    if (!this.moving || !allowMove) return;
    const k = 1 - Math.exp(-dt / 0.45);
    for (const key of ['cx', 'top', 'h']) r[key] += (d[key] - r[key]) * k;
    if (dh < 0.01 && dp < 0.01) this.moving = false;
  }
  current(camAspect, wallAspect) {
    if (this.region) return this.region;
    const h = Math.min(1, camAspect / wallAspect);
    return { cx: camAspect / 2, top: (1 - h) / 2, h };
  }
  mapping(camAspect, wallAspect) {
    const { cx, top, h } = this.current(camAspect, wallAspect), w = h * wallAspect;
    return {
      toWall: p => V((cx + w / 2 - p.x) / w * wallAspect, (p.y - top) / h),
      toCam: q => V(cx + w / 2 - (q.x / wallAspect) * w, top + q.y * h),
      scale: 1 / h,
    };
  }
}

/// Can the camera see the patient's whole reach space? Uses the expected reach (shoulders ± arm),
/// not a raised-arms pose, so people with limited shoulder range still pass.
/// env = how far the exercise asks the arm to go sideways and upwards (fractions of arm length).
function evaluatePosition(fi, camAspect, exercise, posture, env = { lat: 0.95, up: 0.95 }) {
  if (!fi) return 'notVisible';
  const m = 0.015, side = env.lat * fi.arm;
  const left = fi.ms.x - fi.half - side, right = fi.ms.x + fi.half + side, top = fi.ms.y - env.up * fi.arm;
  if (top < m || right - left > camAspect - 2 * m) return fi.arm < 0.16 && top < m ? 'adjustCamera' : 'tooClose';
  if (left < m) return 'moveLeft';            // the camera faces the patient: image-left is their right
  if (right > camAspect - m) return 'moveRight';
  if (fi.arm < 0.11) return 'tooFar';
  if (exercise === 'balance' && posture === 'stand' && !fi.ankles) return 'showFeet';
  return 'good';
}

class Body {
  constructor() {
    this.filters = Array.from({ length: NJ }, () => new OneEuro());
    this.cam = Array.from({ length: NJ }, () => V(0, 0));
    this.conf = new Float32Array(NJ);
    this.wall = Array.from({ length: NJ }, () => V(0, 0));
    this.vel = Array.from({ length: NJ }, () => V(0, 0));
    this.pred = Array.from({ length: NJ }, () => V(0, 0));
    this.lastSeen = -100; this.now = 0; this.lastT = -1; this.swapped = false; this.camAspect = 9 / 16; this.people = 0;
    this.resetArm(); this.armLen = 0.2; this.swWin = []; this.shoulderRef = 0;
    this.elev2D = [null, null]; this.trunkLean = null; this.bodyLean = null; this.leanRef = 'none';
  }
  resetFilters() { this.filters.forEach(f => f.reset()); this.conf.fill(0); this.swWin = []; this.shoulderRef = 0; this.lastSeen = -100; this.lastT = -1; }
  resetArm() { this.ratios = []; this.armRatio = 2.2; this.armMeasured = false; this.armSamplesSinceReset = 0; }
  present(t = this.now) { return t - this.lastSeen < 0.6; }
  valid(j, c = 0.3) { return this.conf[j] >= c && this.present(); }
  tipValid(s) { return this.valid(s.T, 0.2); }
  get armCam() { return this.armRatio * this.shoulderRef; }
  mid(a, b) { return V((this.wall[a].x + this.wall[b].x) / 2, (this.wall[a].y + this.wall[b].y) / 2); }
  get midShoulder() { return this.valid(J.lS) && this.valid(J.rS) ? this.mid(J.lS, J.rS) : null; }
  get midHip() { return this.valid(J.lH) && this.valid(J.rH) ? this.mid(J.lH, J.rH) : null; }
  get midAnkle() { return this.valid(J.lA) && this.valid(J.rA) ? this.mid(J.lA, J.rA) : null; }

  /// frame: { time, p: [camera-prop V], c: [conf], people, camAspect }
  ingest(f, map, posture, t) {
    this.now = t; this.camAspect = f.camAspect; this.people = f.people;
    const p = f.p.slice(), c = f.c.slice();
    // Anatomical sides: after the mirror mapping the patient's left must be on the screen's left.
    if (c[J.lS] > 0.3 && c[J.rS] > 0.3) {
      const dl = map.toWall(p[J.lS]).x, dr = map.toWall(p[J.rS]).x;
      if (Math.abs(dl - dr) > 0.02) this.swapped = dl > dr;
    }
    if (this.swapped) for (const [a, b] of LR_PAIRS) { [p[a], p[b]] = [p[b], p[a]]; [c[a], c[b]] = [c[b], c[a]]; }
    if (c.some(x => x > 0.3)) this.lastSeen = t;
    for (let j = 0; j < NJ; j++) {
      if (c[j] >= 0.15) { this.cam[j] = this.filters[j].filter(p[j], f.time); this.conf[j] = c[j]; }
      else this.conf[j] *= 0.6;
      this.wall[j] = map.toWall(this.cam[j]);
      const v = this.filters[j].dx;
      const ahead = map.toWall(V(this.cam[j].x + v.x * 0.03, this.cam[j].y + v.y * 0.03));
      let wv = V((ahead.x - this.wall[j].x) / 0.03, (ahead.y - this.wall[j].y) / 0.03);
      const sp = vlen(wv); if (sp > 4) wv = vmul(wv, 4 / sp);
      this.vel[j] = wv;
    }
    this.lastT = f.time;
    this.derive(posture, map);
  }
  /// Re-map wall positions after the framing changed (no new camera frame needed).
  remap(map) { for (let j = 0; j < NJ; j++) this.wall[j] = map.toWall(this.cam[j]); }
  predict(t, lead) {
    this.now = t;
    const a = clamp(t - this.lastT + lead, 0, 0.1);
    for (let j = 0; j < NJ; j++) this.pred[j] = V(this.wall[j].x + this.vel[j].x * a, this.wall[j].y + this.vel[j].y * a);
  }
  derive(posture, map) {
    const cam = this.cam, conf = this.conf;
    // Shoulder elevation in the camera image: humerus against the trunk axis (frontal plane).
    let down = V(0, 1);
    if (conf[J.lH] > 0.3 && conf[J.rH] > 0.3 && conf[J.lS] > 0.3 && conf[J.rS] > 0.3) {
      const mh = V((cam[J.lH].x + cam[J.rH].x) / 2, (cam[J.lH].y + cam[J.rH].y) / 2);
      const ms = V((cam[J.lS].x + cam[J.rS].x) / 2, (cam[J.lS].y + cam[J.rS].y) / 2);
      down = vnorm(vsub(mh, ms));
    }
    for (const s of SIDES) {
      if (conf[s.S] > 0.3 && conf[s.E] > 0.3) this.elev2D[s.i] = angleBetween(vsub(cam[s.E], cam[s.S]), down);
      else if (conf[s.S] > 0.3 && conf[s.W] > 0.3) this.elev2D[s.i] = angleBetween(vsub(cam[s.W], cam[s.S]), down);
      else this.elev2D[s.i] = null;
    }
    // Leans on screen (+ = patient's right).
    const ms = this.midShoulder, mh = this.midHip, ma = this.midAnkle;
    this.trunkLean = ms && mh ? toDeg(Math.atan2(ms.x - mh.x, -(ms.y - mh.y))) : null;
    if (posture === 'stand' && ms && ma) { this.bodyLean = toDeg(Math.atan2(ms.x - ma.x, -(ms.y - ma.y))); this.leanRef = 'ankles'; }
    else if (this.trunkLean != null) { this.bodyLean = this.trunkLean; this.leanRef = 'hips'; }
    else { this.bodyLean = null; this.leanRef = 'none'; }
    // Arm length: (upper arm + forearm + hand) ÷ shoulder width, from straight-elbow frames with the
    // patient facing the camera; 85th percentile (foreshortening only shortens, outliers are ignored).
    const swNow = conf[J.lS] > 0.35 && conf[J.rS] > 0.35 ? vdist(cam[J.lS], cam[J.rS]) : null;
    if (swNow != null) this.swWin.push([this.now, swNow]);
    while (this.swWin.length && this.now - this.swWin[0][0] > 1.2) this.swWin.shift();
    if (this.swWin.length) this.shoulderRef = Math.max(...this.swWin.map(x => x[1]));
    if (swNow != null && this.shoulderRef > 0.01 && swNow >= 0.85 * this.shoulderRef) {
      for (const s of SIDES) {
        if (conf[s.S] <= 0.4 || conf[s.E] <= 0.4 || conf[s.W] <= 0.4) continue;
        if (angleBetween(vsub(cam[s.S], cam[s.E]), vsub(cam[s.W], cam[s.E])) < 150) continue;
        const up = vdist(cam[s.S], cam[s.E]), fo = vdist(cam[s.W], cam[s.E]);
        const hand = clamp(vdist(cam[s.T], cam[s.W]), 0.3 * fo, 0.85 * fo);
        const ratio = (up + fo + hand) / swNow;
        if (ratio <= 1.4 || ratio >= 3.2) continue;
        this.ratios.push(ratio); this.armSamplesSinceReset++;
        if (this.ratios.length > 900) this.ratios.shift();
      }
      if (this.ratios.length >= 15 && (this.armSamplesSinceReset % 10 === 0 || !this.armMeasured)) {
        const s = [...this.ratios].sort((a, b) => a - b);
        this.armRatio = s[Math.floor((s.length - 1) * 0.85)];
        this.armMeasured = true;
      }
    }
    if (conf[J.lS] > 0.3 && conf[J.rS] > 0.3 && this.armCam > 0) {
      const msC = V((cam[J.lS].x + cam[J.rS].x) / 2, (cam[J.lS].y + cam[J.rS].y) / 2);
      const target = vdist(map.toWall(msC), map.toWall(V(msC.x, msC.y + this.armCam)));
      this.armLen = clamp(this.armLen + (target - this.armLen) * 0.2, 0.04, 0.9);
    }
  }
  reachPct(s) {
    if (!this.valid(s.S) || !this.tipValid(s)) return null;
    return vdist(this.wall[s.T], this.wall[s.S]) / Math.max(this.armLen, 1e-3) * 100;
  }
  framingInputs(posture) {
    const c = this.conf, cam = this.cam;
    if (!this.present() || c[J.lS] <= 0.3 || c[J.rS] <= 0.3 || this.shoulderRef <= 0.01) return null;
    const ms = V((cam[J.lS].x + cam[J.rS].x) / 2, (cam[J.lS].y + cam[J.rS].y) / 2);
    const ankles = c[J.lA] > 0.3 && c[J.rA] > 0.3 && Math.max(cam[J.lA].y, cam[J.rA].y) < 0.985;
    let baseX = null;
    if (posture === 'stand' && ankles) baseX = (cam[J.lA].x + cam[J.rA].x) / 2;
    else if (c[J.lH] > 0.3 && c[J.rH] > 0.3) baseX = (cam[J.lH].x + cam[J.rH].x) / 2;
    return { ms, arm: this.armCam, half: this.shoulderRef / 2, baseX, ankles };
  }
}

// =====================================================================================
// A simulated body in screen units (standard proportions). Used for the demo ghost, the
// positioning figure, and the ?sim test patient. Reaches with minimum-jerk movements.
// =====================================================================================
class SimBody {
  constructor(opts = {}) {
    this.maxElev = opts.maxElev || [180, 180];
    this.maxReach = opts.maxReach || [1, 1];
    this.leanFactor = opts.leanFactor || [1.06, 1.06];
    this.sway = opts.sway ?? 1;
    this.slowness = opts.slowness ?? 1;
    this.reset();
  }
  reset() {
    this.tip = [V(0, 0), V(0, 0)]; this.from = [V(0, 0), V(0, 0)]; this.to = [V(0, 0), V(0, 0)];
    this.start = [0, 0]; this.dur = [1, 1]; this.goal = [-2, -2]; this.lean = 0; this.leanGoal = 0; this.init = false; this.lastNow = null;
  }
  static layout(std, aspect, posture) {
    const A = std.A, cx = aspect / 2, sY = std.shoulderY, hipY = sY + 0.66 * A;
    const sit = posture === 'sit';
    const kneeY = sit ? hipY + 0.06 * A : hipY + 0.56 * A;
    const ankleY = sit ? kneeY + 0.56 * A : hipY + 1.12 * A;
    return { A, cx, sY, hipY, kneeY, ankleY, sit, pivot: sit ? V(cx, hipY) : V(cx, ankleY) };
  }
  shoulder(side, std, aspect) { return V(aspect / 2 + side.out * std.half, std.shoulderY); }
  /// targets: [{ pos, side (or null), state, meta: { lean } }]
  joints(now, targets, exercise, posture, std, aspect, baseLean = 0) {
    const dt = this.lastNow == null ? 0 : clamp(now - this.lastNow, 0, 0.1);
    this.lastNow = now;
    const g = SimBody.layout(std, aspect, posture), A = g.A, cx = g.cx;
    const swayA = (Math.sin(now * 0.6) * 0.6 + Math.sin(now * 1.7) * 0.25) * this.sway;
    const live = targets.filter(t => t.state === 'active' || t.state === 'growing');
    const lt = live.find(t => t.meta && t.meta.lean != null);
    this.leanGoal = exercise === 'balance' && lt ? lt.meta.lean * (lt.meta.lean < 0 ? this.leanFactor[0] : this.leanFactor[1]) + baseLean : 0;
    this.lean = approach(this.lean, this.leanGoal, dt, 0.5 * this.slowness);
    const a = toRad(this.lean + swayA * 0.6), ca = Math.cos(a), sa = Math.sin(a);
    const rot = p => { const vx = p.x - g.pivot.x, vy = p.y - g.pivot.y; return V(g.pivot.x + vx * ca - vy * sa, g.pivot.y + vx * sa + vy * ca); };
    const w = new Array(NJ);
    const hw = 0.2 * A;
    w[J.lH] = V(cx - hw, g.hipY); w[J.rH] = V(cx + hw, g.hipY);
    if (g.sit) {
      w[J.lK] = V(cx - 0.27 * A, g.kneeY); w[J.rK] = V(cx + 0.27 * A, g.kneeY);
      w[J.lA] = V(cx - 0.25 * A, g.ankleY); w[J.rA] = V(cx + 0.25 * A, g.ankleY);
    } else {
      w[J.lK] = V(cx - 0.19 * A, g.kneeY); w[J.rK] = V(cx + 0.19 * A, g.kneeY);
      w[J.lA] = V(cx - 0.19 * A, g.ankleY); w[J.rA] = V(cx + 0.19 * A, g.ankleY);
    }
    w[J.neck] = V(cx, g.sY - 0.14 * A); w[J.nose] = V(cx, g.sY - 0.3 * A);
    w[J.lS] = V(cx - std.half, g.sY); w[J.rS] = V(cx + std.half, g.sY);
    const upperJ = [J.neck, J.nose, J.lS, J.rS].concat(g.sit ? [] : [J.lH, J.rH]);
    for (const j of upperJ) w[j] = rot(w[j]);
    const upper = 0.42 * A, fore = 0.33 * A, hand = 0.25 * A, arm = upper + fore + hand;
    for (const s of SIDES) {
      const S = w[s.S], i = s.i;
      const rest = V(S.x + s.out * 0.11 * A, S.y + arm * 0.96);
      if (!this.init) { this.tip[i] = rest; this.from[i] = rest; this.to[i] = rest; }
      let gid = -1, dest = rest;
      if (exercise !== 'balance') {
        const mine = live.filter(t => {
          if (t.side) return t.side === s.k;
          return (vdist(t.pos, w[J.lS]) <= vdist(t.pos, w[J.rS]) ? 'left' : 'right') === s.k;
        });
        if (mine.length) { gid = mine[0].id; dest = this.capability(s, S, mine[0].pos, arm); }
      }
      if (gid !== this.goal[i]) {
        this.goal[i] = gid; this.from[i] = this.tip[i]; this.to[i] = dest;
        this.start[i] = now + (gid >= 0 ? 0.3 + rnd() * 0.3 : 0.15);
        this.dur[i] = (0.7 + vdist(dest, this.tip[i]) / A * 0.8) * this.slowness;
      } else if (gid >= 0) this.to[i] = dest;
      const tau = clamp((now - this.start[i]) / this.dur[i], 0, 1);
      const sj = tau * tau * tau * (10 - 15 * tau + 6 * tau * tau);
      const tr = 0.004 * A * this.sway;
      this.tip[i] = V(lerp(this.from[i].x, this.to[i].x, sj) + Math.sin(now * 9.1 + i * 2) * tr, lerp(this.from[i].y, this.to[i].y, sj) + Math.cos(now * 7.3 + i) * tr);
      const [E, W, T] = this.ik(S, this.tip[i], s, upper, fore, hand);
      w[s.E] = E; w[s.W] = W; w[s.T] = T;
    }
    this.init = true;
    return w;
  }
  capability(s, S, goal, arm) {
    let v = vsub(goal, S), d = vlen(v);
    const maxD = arm * this.maxReach[s.i];
    if (d > maxD) { v = vmul(v, maxD / d); d = maxD; }
    const el = angleBetween(v, V(0, 1)), cap = this.maxElev[s.i];
    if (el > cap) { const r = toRad(cap), sx = v.x >= 0 ? 1 : -1; v = V(sx * Math.sin(r) * d, Math.cos(r) * d); }
    return vadd(S, v);
  }
  ik(S, T, s, L1, fore, hand) {
    const L2 = fore + hand;
    let v = vsub(T, S), d = vlen(v);
    if (d < 1e-5) { v = V(0, 1); d = 1e-5; }
    const dc = clamp(d, Math.abs(L1 - L2) + 0.002, L1 + L2 - 0.0005);
    const dir = vmul(v, 1 / d);
    const A = Math.acos(clamp((L1 * L1 + dc * dc - L2 * L2) / (2 * L1 * dc), -1, 1));
    const rotv = (u, a) => V(u.x * Math.cos(a) - u.y * Math.sin(a), u.x * Math.sin(a) + u.y * Math.cos(a));
    const e1 = vadd(S, vmul(rotv(dir, A), L1)), e2 = vadd(S, vmul(rotv(dir, -A), L1));
    const sc = e => e.y + s.out * e.x * 0.5;
    const E = sc(e1) > sc(e2) ? e1 : e2;
    const tipP = vadd(S, vmul(dir, dc));
    const fd = vnorm(vsub(tipP, E));
    return [E, vadd(E, vmul(fd, fore)), vadd(E, vmul(fd, L2))];
  }
}

// =====================================================================================
// Demo: a figure of light performs the chosen exercise exactly as set up, with captions
// and voice. Demo flowers are never counted.
// =====================================================================================
class Demo {
  constructor(game) {
    this.game = game;
    this.ghost = new SimBody({ maxElev: [180, 180], maxReach: [1, 1], leanFactor: [1.08, 1.08], sway: 0.35, slowness: 1.3 });
    this.running = false; this.flowers = []; this.joints = null; this.alpha = 0; this.lantern = null; this.pivot = V(0, 0);
    this.caption = null; this.nextId = 1e6;
  }
  start(cfg) {
    this.cfg = cfg; this.flowers = []; this.ghost.reset(); this.alpha = 0; this.clock = 0; this.elapsed = 0; this.index = -1; this.holdId = null;
    this.caption = null; this.lantern = null; this.running = true;
    const g = SimBody.layout(cfg.std, cfg.aspect, cfg.posture);
    this.pivot = V(cfg.aspect / 2, g.sit ? g.hipY : Math.min(g.ankleY, 0.97));
    this.beats = Demo.script(cfg);
    this.joints = this.ghost.joints(0, [], cfg.exercise, cfg.posture, cfg.std, cfg.aspect);
  }
  stop() {
    this.game.narrator.stop(); this.running = false; this.caption = null;
    for (const f of this.flowers) if (f.state === 'active' || f.state === 'growing') { f.state = 'fading'; f.stateAge = 0; }
  }
  get dwell() { return clamp(this.cfg.preset.hold, 1, 2.5); }
  get activeArm() {
    if (this.cfg.exercise === 'balance') return null;
    const f = [...this.flowers].reverse().find(f => f.state === 'active' || f.state === 'growing' || (f.state === 'completing' && f.stateAge < 0.6));
    if (!f) return null;
    if (f.side) return f.side;
    return vdist(f.pos, this.joints[J.lS]) <= vdist(f.pos, this.joints[J.rS]) ? 'left' : 'right';
  }
  update(dt) {
    const game = this.game;
    if (!this.running) { this.alpha = approach(this.alpha, 0, dt, 0.25); this.animate(dt); return true; }
    this.clock += dt; this.elapsed += dt; this.beatClock += dt;
    const c = this.cfg;
    this.joints = this.ghost.joints(this.clock, this.flowers, c.exercise, c.posture, c.std, c.aspect);
    const fadeOut = this.index >= 0 && this.index < this.beats.length && this.beats[this.index].outro && this.beatClock > 0.8;
    this.alpha = approach(this.alpha, fadeOut ? 0 : 1, dt, fadeOut ? 0.45 : 0.5);
    if (c.exercise === 'balance') {
      const a = toRad(clamp(this.ghost.lean * game.visualGain, -70, 70));
      this.lantern = V(this.pivot.x + game.lanternR(c) * Math.sin(a), this.pivot.y - game.lanternR(c) * Math.cos(a));
    } else this.lantern = null;
    const spoken = !game.narrator.speaking || this.beatClock > 6;
    for (const f of this.flowers) {
      if (!(f.state === 'active' || (f.state === 'growing' && f.stateAge > 0.3))) continue;
      let touching = false;
      if (this.lantern) touching = vdist(this.lantern, f.pos) < f.radius * 1.35;
      else for (const s of SIDES) if ((!f.side || f.side === s.k) && vdist(this.joints[s.T], f.pos) < f.radius * 1.25) touching = true;
      f.hovered = touching;
      if (!touching || f.id !== this.holdId || !spoken) continue;
      f.progress += dt / this.dwell;
      const level = Math.floor(f.progress * 3);
      if (level > f.tick && level < 3) game.sound.tick(level, game.pan(f.pos));
      f.tick = level;
      if (f.progress >= 1) {
        f.state = 'completing'; f.stateAge = 0; f.flash = 1; f.progress = 1;
        game.burst(f); game.sound.complete(game.pan(f.pos));
      }
    }
    this.animate(dt);
    if (this.index < 0 || this.beatDone()) this.advance();
    return !this.running;
  }
  animate(dt) {
    for (const f of this.flowers) Game.animateFlower(f, dt, false, e => this.game.emitters.push(e));
    this.flowers = this.flowers.filter(f => !((f.state === 'completing' && f.stateAge > 1.4) || (f.state === 'fading' && f.stateAge > 1.6)));
  }
  beatDone() {
    const b = this.beats[this.index];
    if (this.beatClock < b.minDur || this.game.narrator.speaking) return false;
    if (b.hold && this.holdId != null && this.beatClock < 14) {
      if (this.flowers.some(f => f.id === this.holdId && (f.state === 'active' || f.state === 'growing'))) return false;
    }
    return true;
  }
  advance() {
    this.index++; this.beatClock = 0;
    if (this.index >= this.beats.length) { this.running = false; this.caption = null; return; }
    const b = this.beats[this.index];
    if (b.spawn) this.spawn(b.spawn);
    if (b.hold) { const live = this.flowers.filter(f => f.state === 'active' || f.state === 'growing'); this.holdId = live.length ? live[live.length - 1].id : null; }
    if (b.line) { this.caption = line(b.line)[0]; this.game.say(b.line); }
  }
  spawn(sp) {
    const c = this.cfg, std = c.std, A = std.A;
    const side = SIDES.find(s => s.k === sp.place);
    const S = this.ghost.shoulder(side, std, c.aspect);
    const reach = Math.min(Math.max(c.preset.dist || 0.9, 0.9), 0.98) * A;
    let pos, meta = {};
    if (sp.arc != null) { const r = toRad(sp.arc); pos = V(S.x + side.out * Math.sin(r) * reach, S.y + Math.cos(r) * reach); }
    else if (sp.clock != null) { const r = toRad(sp.clock * 30); pos = V(S.x + Math.sin(r) * reach, S.y - Math.cos(r) * reach); }
    else { const r = toRad(clamp(sp.lean * this.game.visualGain, -70, 70)); const R = this.game.lanternR(c); pos = V(this.pivot.x + Math.sin(r) * R, this.pivot.y - Math.cos(r) * R); meta.lean = sp.lean; }
    const radius = flowerRadius(std, c.aspect, c.preset.size) * (c.exercise === 'balance' ? 1.25 : 1);
    pos = this.game.clampToScreen(pos, radius);
    const [hue, core] = Game.pickHue();
    this.flowers.push(Game.makeFlower({ id: this.nextId++, pos, radius, hue, core, side: sp.side, place: sp.place, meta, life: 0 }));
    this.game.emitters.push(E.sparkle(pos, hue, radius));
    this.game.sound.spawn(this.game.pan(pos));
  }
  static script(c) {
    const ex = c.exercise, sit = c.posture === 'sit', p = c.preset;
    const first = c.arm === 'right' ? 'right' : 'left';
    const both = c.arm === 'both';
    const second = both ? (first === 'left' ? 'right' : 'left') : first;
    const req = k => (ex === 'balance' ? null : k);
    const beats = [{ line: { zh: ['先看示範', '先睇下點樣玩。'], en: ['Watch first', 'First, watch how to play.'] }, minDur: 2.4 }];
    let reachLine, s1, s2, secondLine;
    if (ex === 'rom') {
      const [lo, hi] = p.arc;
      reachLine = { zh: ['舉手觸碰花朵', '慢慢舉高手，掂住朵花。'], en: ['Raise your arm to the flower', 'Slowly raise your arm to touch the flower.'] };
      s1 = { side: req(first), place: first, arc: lo + (hi - lo) * 0.4 };
      if (both) {
        s2 = { side: req(second), place: second, arc: lo + (hi - lo) * 0.75 };
        secondLine = { zh: ['左右手輪流', '跟住輪到另一隻手。'], en: ['Left and right arms take turns', 'Next, the other arm takes a turn.'] };
      } else {
        s2 = { side: req(second), place: second, arc: hi };
        secondLine = { zh: ['花朵會在不同高度出現', '花會喺唔同高度出現。'], en: ['Flowers appear at different heights', 'Flowers appear at different heights.'] };
      }
    } else if (ex === 'reach') {
      reachLine = { zh: ['伸手觸碰花朵', '伸手去掂朵花。'], en: ['Reach for the flower', 'Reach out to touch the flower.'] };
      s1 = { side: req(first), place: first, clock: first === 'left' ? 10.5 : 1.5 };
      if (p.cross) {
        s2 = { side: req(first), place: first, clock: first === 'left' ? 2.6 : 9.4 };
        secondLine = { zh: ['有些花在身體另一邊', '有啲花喺身體另一邊，要伸手過去。'], en: ['Some flowers are across your body', 'Some flowers are across your body — reach over to them.'] };
      } else {
        s2 = { side: req(second), place: second, clock: second === 'left' ? 9 : 3 };
        secondLine = { zh: ['花朵會在不同方向出現', '花會喺唔同方向出現。'], en: ['Flowers appear in different directions', 'Flowers appear in different directions.'] };
      }
    } else {
      const lean = sit ? p.leanSit : p.leanStand;
      reachLine = { zh: ['身體慢慢傾向花朵', '身體慢慢側向朵花，個燈籠會跟住你郁。'], en: ['Lean gently towards the flower', 'Lean gently towards the flower. The lantern moves with you.'] };
      s1 = { side: null, place: 'left', lean: -lean };
      s2 = { side: null, place: 'right', lean };
      secondLine = { zh: ['再傾向另一邊', '再慢慢側去另一邊。'], en: ['Now lean the other way', 'Now lean gently the other way.'] };
    }
    const holdLine = ex === 'balance'
      ? { zh: ['保持傾側，直到光環填滿', '保持住，等個光環填滿。'], en: ['Hold the lean until the ring fills', 'Hold the lean until the ring fills.'] }
      : { zh: ['保持不動，直到光環填滿', '保持唔好郁，等個光環填滿。'], en: ['Hold still until the ring fills', 'Hold still until the ring fills.'] };
    beats.push({ line: reachLine, spawn: s1, minDur: 1.8 });
    beats.push({ line: holdLine, minDur: 1.0, hold: true });
    beats.push({ line: { zh: ['花開了！', '朵花開咗！'], en: ['The flower blooms!', 'The flower blooms!'] }, minDur: 1.6 });
    beats.push({ line: secondLine, spawn: s2, minDur: 2.0, hold: true });
    if (ex === 'balance') beats.push({ line: sit ? { zh: ['保持坐穩', '坐穩，唔好起身。'], en: ['Stay seated', 'Stay seated.'] }
      : { zh: ['雙腳保持不動', '對腳企定，唔好郁。'], en: ['Keep your feet still', 'Keep your feet still.'] }, minDur: 2.4 });
    beats.push({ line: { zh: ['輪到你了', '到你喇！'], en: ['Your turn', "Now it's your turn!"] }, minDur: 2.4, outro: true });
    return beats;
  }
}

// =====================================================================================
// Particles emitters (simulated on the CPU, drawn by the renderer)
// =====================================================================================
const K = { firefly: 0, pollen: 1, petal: 2, sparkle: 3 };
const E = {
  make: o => Object.assign({ vx: 0, vy: 0, hueRange: 0.05, spread: Math.PI * 2, angle: 0, sizeRange: 0.3, radius: 0 }, o),
  sparkle: (p, hue, r) => E.make({ x: p.x, y: p.y, count: 36, kind: K.sparkle, life: 0.9, hue, speed: 0.12, size: 0.004, radius: r * 0.4 }),
  pollenPuff: (p, hue, r) => E.make({ x: p.x, y: p.y, count: 50, kind: K.pollen, life: 1.8, hue, hueRange: 0.1, speed: 0.06, size: 0.003, radius: r }),
};

// =====================================================================================
// Game
// =====================================================================================
const HUES = [[0.93, 0.10], [0.02, 0.13], [0.12, 0.05], [0.50, 0.14], [0.78, 0.95], [0.58, 0.12], [0.86, 0.55]];
let lastHue = -1;

class SustainedPeak {
  constructor(win = 0.3) { this.win = win; this.buf = []; }
  add(t, v) {
    if (v == null) { this.buf = []; return null; }
    this.buf.push([t, v]);
    while (this.buf.length && t - this.buf[0][0] > this.win) this.buf.shift();
    if (t - this.buf[0][0] < this.win * 0.8) return null;
    return Math.min(...this.buf.map(x => x[1]));
  }
}

class Game {
  constructor(app) {
    this.app = app; this.body = app.body; this.sound = app.sound; this.narrator = app.narrator;
    this.phase = 'idle'; this.targets = []; this.ground = []; this.emitters = []; this.prompt = null; this.now = 0;
    this.demo = new Demo(this);
    this.lantern = null; this.pivot = V(0.3, 0.9);
  }
  static pickHue() { let i = Math.floor(rnd() * HUES.length); if (HUES[i][0] === lastHue) i = (i + 1) % HUES.length; lastHue = HUES[i][0]; return HUES[i]; }
  static makeFlower(o) {
    return Object.assign({ petals: [5, 6, 7, 8][Math.floor(rnd() * 4)], seed: rnd(), state: 'growing', stateAge: 0, age: 0, progress: 0, bloom: 0, alpha: 0, flash: 0,
      hovered: false, firstTouch: null, tick: 0, mote: 0, maxReach: 0, maxLean: -Infinity, meta: {} }, o);
  }
  static animateFlower(t, dt, frozen, emit) {
    t.stateAge += dt;
    const a = t.stateAge;
    if (t.state === 'growing') { t.alpha = smooth01(0, 0.7, a); t.bloom = approach(t.bloom, 0.32, dt, 0.25); if (a > 0.7) { t.state = 'active'; t.stateAge = 0; } }
    else if (t.state === 'active') {
      t.alpha = approach(t.alpha, 1, dt, 0.2); t.bloom = approach(t.bloom, 0.32 + 0.68 * t.progress, dt, 0.12);
      if (t.hovered && !frozen) {
        t.mote += dt * 40;
        while (t.mote >= 1) {
          t.mote -= 1;
          const ang = rnd() * Math.PI * 2, r = t.radius * 2.4;
          emit(E.make({ x: t.pos.x + Math.cos(ang) * r, y: t.pos.y + Math.sin(ang) * r, vx: -Math.sin(ang) * 0.12, vy: Math.cos(ang) * 0.12, count: 1, kind: K.pollen, life: 1.4, hue: t.core, speed: 0.01, size: 0.0035 }));
        }
      }
    } else if (t.state === 'completing') { t.bloom = approach(t.bloom, 1.2, dt, 0.15); t.flash = Math.max(0, 1 - a * 2.4); t.alpha = 1 - smooth01(0.3, 1.3, a); t.radius *= 1 + dt * 0.35; }
    else if (t.state === 'fading') { t.alpha = 1 - smooth01(0, 1.5, a); t.bloom = approach(t.bloom, 0.08, dt, 0.5); t.pos.y += dt * 0.012; }
  }

  get aspect() { return this.app.aspect; }
  get inSession() { return !['idle', 'complete'].includes(this.phase); }
  get live() { return this.targets.some(t => t.state === 'growing' || t.state === 'active'); }
  get visualGain() { return this.cfg ? this.cfg.gain : 2.5; }
  lanternR(cfg) { return clamp(1.7 * cfg.std.A, 0.2, 0.5); }
  pan(p) { return clamp(p.x / this.aspect * 2 - 1, -0.8, 0.8); }
  clampToScreen(p, r) { const m = r * 1.4; return V(clamp(p.x, m, this.aspect - m), clamp(p.y, m + 0.06, 1 - m - 0.08)); }
  say(l) { const x = l[S.lang]; if (x && x[1]) this.narrator.say(x[1], S.lang); }
  setPrompt(l, big = null) { this.prompt = l ? { l, big } : null; }

  // ------------------------------------------------------------- session control
  start(choice) {
    const preset = PRESETS[choice.exercise][choice.level];
    const lateral = choice.exercise === 'rom' ? 0.9 : choice.exercise === 'reach' ? preset.dist : 0.6;
    const std = stdBody(this.aspect, choice.posture, lateral);
    // the space the camera must see: sideways and overhead reach for this exercise (balance: lean room and the head)
    const env = choice.exercise === 'rom' ? { lat: 0.92, up: 0.95 } : choice.exercise === 'reach' ? { lat: preset.dist * 0.95, up: preset.dist * 0.95 } : { lat: 0.6, up: 0.45 };
    const lean = choice.exercise === 'balance' ? (choice.posture === 'sit' ? preset.leanSit : preset.leanStand) : null;
    // balance: the lantern swings up to 35° on screen, less on a narrow phone, so the flower is never pulled
    // inward by the screen edge (which would let a smaller lean than prescribed reach it)
    let gain = 2.5;
    if (lean) {
      const r = flowerRadius(std, this.aspect, preset.size) * 1.25, R = this.lanternR({ std });
      const fit = toDeg(Math.asin(clamp((this.aspect / 2 - r * 1.4) / R, 0.3, 1))) - 1;
      gain = Math.min(35, fit) / lean;
    }
    this.cfg = { ...choice, preset, std, env, aspect: this.aspect, lean, gain };
    Object.assign(this, {
      targets: [], ground: [], emitters: [], setIndex: 0, resolvedInSet: 0, completedInSet: 0, presented: 0, completed: 0,
      seq: [0, 0], alt: 'left', spawnCool: 0, lastInteraction: this.now, activeTime: 0, touchTimes: [],
      peaks: { elev: [null, null], reach: [null, null], lean: [null, null], highest: [null, null] },
      sus2D: [new SustainedPeak(), new SustainedPeak()], susLean: new SustainedPeak(0.5),
      trunkSamples: [], leanSamples: [], baseLean: 0, startedAt: this.now, endedAt: null, lastClock: null,
      demoInfo: { shown: true, skipped: false }, posInfo: { seconds: 0, skipped: false }, endedEarly: false, record: null,
    });
    this.sound.start();
    this.beginPositioning();
  }
  enter(p) { this.phase = p; this.phaseStart = this.now; }

  beginPositioning() {
    this.enter('positioning'); this.posGood = 0; this.posPassed = null; this.cueStatus = null; this.cueAt = this.now;
    const l = this.cfg.posture === 'sit' ? L.stepInSit : L.stepIn;
    this.setPrompt(l); this.say(l);
  }
  skipPositioning() { if (this.phase === 'positioning') this.finishPositioning(true); }
  finishPositioning(skipped) {
    this.posInfo = { seconds: r1(this.now - this.phaseStart), skipped };
    this.setPrompt(null); this.narrator.stop();
    this.enter('demo');
    this.app.sound.duck(true);
    this.demo.start({ ...this.cfg, aspect: this.aspect });
  }
  skipDemo() { if (this.phase === 'demo') { this.demo.stop(); this.demoInfo.skipped = true; this.endDemo(); } }
  endDemo() {
    this.app.sound.duck(false); this.setPrompt(null);
    if (this.cfg.exercise === 'balance') { this.enter('baseline'); const l = this.cfg.posture === 'sit' ? L.baseSit : L.baseStand; this.setPrompt(l); this.say(l); }
    else { this.body.resetArm(); this.enter('measuring'); this.setPrompt(L.measure); this.say(L.measure); }
  }
  beginSet(i) {
    this.setIndex = i; this.resolvedInSet = 0; this.completedInSet = 0; this.spawnCool = 1.6;
    this.enter('active'); this.setIntroUntil = this.now + 2.6; this.lastInteraction = this.now;
    this.setPrompt(setTitle(i + 1, this.cfg.preset.sets));
    this.sound.start();
  }
  endSet() {
    if (this.setIndex + 1 < this.cfg.preset.sets) { this.sound.setComplete(); this.enter('rest'); this.celebrate(true); this.cueStatus = null; }
    else this.finish(false);
  }
  pause(auto = false) {
    if (!this.inSession || this.phase === 'paused') return;
    this.pausedFrom = this.phase; this.pausedAt = this.now; this.autoPaused = auto; this.phase = 'paused';
    this.narrator.stop();
    if (auto) { this.setPrompt(L.autoPaused); this.say(L.backInView); }
  }
  resume() {
    if (this.phase !== 'paused') return;
    this.phaseStart += this.now - this.pausedAt;
    this.phase = this.pausedFrom; this.autoPaused = false; this.setPrompt(null); this.lastInteraction = this.now;
    if (this.phase === 'demo') { this.demo.stop(); this.demoInfo.skipped = true; this.endDemo(); }   // a paused demo is not replayed mid-way
  }
  end() {   // therapist / patient pressed "end and save"
    if (!this.inSession) return;
    if (this.phase === 'paused') this.phase = this.pausedFrom;
    if (this.phase === 'demo') { this.demo.stop(); this.app.sound.duck(false); }
    for (const t of this.targets) if (t.state === 'active' || t.state === 'growing') { t.state = 'fading'; t.stateAge = 0; }
    this.finish(true);
  }
  finish(early) {
    this.endedEarly = early; this.endedAt = this.now; this.narrator.stop();
    const p = this.peaks, c = this.cfg;
    this.record = {
      date: new Date().toISOString(), exercise: c.exercise, level: c.level, arm: c.exercise === 'balance' ? null : c.arm, posture: c.posture,
      durationS: Math.round(this.now - this.startedAt), activeS: Math.round(this.activeTime),
      presented: this.presented, completed: this.completed, sets: c.preset.sets, reps: c.preset.reps,
      highest: p.highest.map(r1), elev: p.elev.map(r1), reach: p.reach.map(r1), lean: p.lean.map(r1),
      leanRef: c.exercise === 'balance' ? this.body.leanRef : null,
      meanTouch: this.touchTimes.length ? r1(this.touchTimes.reduce((a, b) => a + b, 0) / this.touchTimes.length) : null,
      endedEarly: early, demoSkipped: this.demoInfo.skipped, positioningSkipped: this.posInfo.skipped,
      flowers: this.ground.map(g => ({ h: r1(g.hue * 100) / 100, c: r1(g.core * 100) / 100, p: g.petals, s: Math.round(g.seed * 1000) / 1000 })),
    };
    this.enter('complete');
    if (!early) { this.setPrompt(L.complete); this.say(L.complete); this.celebrate(false); this.sound.sessionComplete(); }
    this.app.onSessionEnd(this.record);
  }

  // ------------------------------------------------------------- frame update
  update(t, dt) {
    this.now = t;
    const c = this.cfg, b = this.body;
    if (c && c.exercise === 'balance') this.updateLantern(dt);
    switch (this.phase) {
      case 'positioning': this.positioningUpdate(dt); break;
      case 'demo': {
        const done = this.demo.update(dt);
        this.prompt = this.demo.caption ? { l: { [S.lang]: [this.demo.caption, ''] }, big: null } : null;
        if (done) this.endDemo();
        break;
      }
      case 'measuring': {
        if (b.trunkLean != null) this.trunkSamples.push(b.trunkLean);
        const enough = b.armSamplesSinceReset >= 15, el = t - this.phaseStart;
        if (el > 3.5 && !enough && this.prompt?.l !== L.straighten) { this.setPrompt(L.straighten); this.say(L.straighten); }
        if ((enough && el > 2.5) || el > 7) this.beginSet(0);
        break;
      }
      case 'baseline':
        if (b.bodyLean != null) this.leanSamples.push(b.bodyLean);
        if (t - this.phaseStart > 3) { this.baseLean = median(this.leanSamples) ?? 0; this.beginSet(0); }
        break;
      case 'active': this.activeTime += dt; this.activeUpdate(dt); break;
      case 'rest': this.restUpdate(); break;
      case 'paused':
        if (this.autoPaused && this.app.position === 'good' && b.present()) { this.resumeGood = (this.resumeGood || 0) + dt; if (this.resumeGood > 1) { this.resumeGood = 0; this.resume(); } }
        else this.resumeGood = 0;
        break;
    }
    if (this.phase !== 'demo' && this.phase !== 'paused' && (this.demo.alpha > 0.001 || this.demo.flowers.length)) this.demo.update(dt);
    const frozen = this.phase === 'paused';
    for (const f of this.targets) Game.animateFlower(f, dt, frozen, e => this.emitters.push(e));
    this.targets = this.targets.filter(f => !((f.state === 'completing' && f.stateAge > 1.4) || (f.state === 'fading' && f.stateAge > 1.6)));
    for (const g of this.ground) g.age += dt;
  }

  positioningUpdate(dt) {
    const st = this.app.position;
    if (this.posPassed != null) { if (this.now - this.posPassed > 1.6 && !this.narrator.speaking) this.finishPositioning(false); return; }
    if (st === 'good' && this.app.framer.settled) this.posGood += dt; else this.posGood = Math.max(0, this.posGood - dt * 2);
    if (this.posGood >= 1.2) { this.posPassed = this.now; this.setPrompt(L.good); this.narrator.stop(); this.say(L.good); this.sound.complete(0); return; }
    if (this.now - this.phaseStart < 2.5) return;
    if (st === 'good') { this.setPrompt(L.holdStill); return; }
    const l = this.cueLine(st);
    this.setPrompt(l);
    if (st !== this.cueStatus || (!this.narrator.speaking && this.now - this.cueAt > 7)) { this.cueStatus = st; this.cueAt = this.now; this.narrator.stop(); this.say(l); }
  }
  cueLine(st) {
    const sit = this.cfg.posture === 'sit';
    return ({ notVisible: sit ? L.notVisibleSit : L.notVisible, tooClose: sit ? L.tooCloseSit : L.tooClose, tooFar: sit ? L.tooFarSit : L.tooFar,
      moveLeft: L.moveLeft, moveRight: L.moveRight, showFeet: L.showFeet, adjustCamera: L.adjustCamera })[st] || L.holdStill;
  }
  get guideVisible() {
    if (this.phase === 'positioning') return this.posPassed == null || this.now - this.posPassed < 1.2;
    return this.phase === 'rest' && this.app.position !== 'good' && this.restLeft < 10;
  }
  get restLeft() { return this.phase === 'rest' ? Math.max(0, this.cfg.preset.rest - (this.now - this.phaseStart)) : 0; }
  restUpdate() {
    const left = this.restLeft;
    if (left <= 0) { this.beginSet(this.setIndex + 1); return; }
    const secs = Math.ceil(left), clockText = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    const st = this.app.position;
    if (st !== 'good' && left < 10) {
      const l = this.cueLine(st); this.setPrompt(l, clockText);
      if (st !== this.cueStatus) { this.cueStatus = st; this.say(l); }
    } else {
      this.setPrompt(restLine(this.setIndex + 2, this.cfg.preset.sets), clockText);
      if (st === 'good') this.cueStatus = null;
    }
  }

  updateLantern(dt) {
    const b = this.body, c = this.cfg;
    const base = b.midAnkle || b.midHip;
    const g = SimBody.layout(c.std, this.aspect, c.posture);
    this.pivot.x = approach(this.pivot.x, base ? base.x : this.aspect / 2, dt, 1.2);
    this.pivot.y = c.posture === 'sit' ? g.hipY : Math.min(g.ankleY, 0.97);
    if (b.bodyLean != null && b.present()) {
      const rel = b.bodyLean - this.baseLean;
      const a = toRad(clamp(rel * c.gain, -70, 70)), R = this.lanternR(c);
      const target = V(this.pivot.x + R * Math.sin(a), this.pivot.y - R * Math.cos(a));
      this.lantern = this.lantern ? V(approach(this.lantern.x, target.x, dt, 0.06), approach(this.lantern.y, target.y, dt, 0.06)) : target;
    } else this.lantern = null;
  }

  cursors() {
    const b = this.body, cs = [];
    if (this.cfg.exercise === 'balance') { if (this.lantern) cs.push({ side: null, pos: this.lantern, kind: 'lantern' }); }
    else for (const s of SIDES) if (b.tipValid(s)) cs.push({ side: s.k, pos: b.wall[s.T], kind: 'hand', s });
    return cs;
  }

  activeUpdate(dt) {
    const c = this.cfg, p = c.preset, b = this.body;
    // A patient who walks out of view is paused, so flowers do not time out while they are away.
    if (!b.present()) { this.goneFor = (this.goneFor || 0) + dt; if (this.goneFor > 3) { this.goneFor = 0; this.pause(true); return; } }
    else this.goneFor = 0;
    this.spawnCool -= dt;
    const liveN = this.targets.filter(t => t.state === 'growing' || t.state === 'active').length;
    const remaining = p.reps - this.resolvedInSet - liveN;
    if (liveN < (p.simul || 1) && remaining > 0 && this.spawnCool <= 0 && this.now > this.setIntroUntil - 0.8) { this.spawn(); this.spawnCool = 1.4; }
    const cursors = this.cursors();
    let anyHover = false, holding = false;
    for (const t of this.targets) {
      if (!(t.state === 'active' || t.state === 'growing')) continue;
      t.age += dt;
      if (t.state !== 'active' && t.stateAge <= 0.3) continue;
      let by = null, best = Infinity;
      const reach = t.radius * p.tol;
      for (const cu of cursors) {
        if (c.exercise !== 'balance' && t.side && cu.side !== t.side) continue;
        const d = vdist(cu.pos, t.pos), lim = cu.kind === 'lantern' ? reach * 1.1 : reach;
        if (d < lim && d < best) { best = d; by = cu; }
      }
      this.track(t);
      if (by) {
        anyHover = true;
        if (t.firstTouch == null) t.firstTouch = t.age;
        t.hovered = true; this.lastInteraction = this.now;
        t.progress += dt / p.hold;
        if (p.hold >= 0.8 && t.progress > 0.12) holding = true;
      } else { t.hovered = false; t.progress = Math.max(0, t.progress - p.decay * dt); }
      const level = Math.floor(t.progress * 3);
      if (level > t.tick && level < 3) this.sound.tick(level, this.pan(t.pos));
      t.tick = level;
      if (t.progress >= 1) this.complete(t, by);
      // Untouched flowers fade after the level's time limit; "no limit" still lets go gently after 30 s.
      else if (!t.hovered && t.age > (p.life > 0 ? p.life : 30)) this.miss(t);
    }
    if (this.now < this.setIntroUntil) { /* keep the set title */ }
    else if (!b.present()) this.setPrompt(L.backInView);
    else if (holding) this.setPrompt(L.hold);
    else if (!anyHover && (this.resolvedInSet === 0 || this.now - this.lastInteraction > 9)) this.setPrompt(c.exercise === 'rom' ? L.instRom : c.exercise === 'reach' ? L.instReach : L.instBalance);
    else this.setPrompt(null);
    if (this.resolvedInSet >= p.reps && !this.live) this.endSet();
    this.updatePeaks();
  }

  track(t) {
    const b = this.body;
    if (this.cfg.exercise === 'balance') {
      if (b.bodyLean != null && t.meta.lean != null) t.maxLean = Math.max(t.maxLean, (b.bodyLean - this.baseLean) * Math.sign(t.meta.lean));
      return;
    }
    for (const s of SIDES) {
      if ((t.side && t.side !== s.k) || !b.tipValid(s) || !b.valid(s.S)) continue;
      t.maxReach = Math.max(t.maxReach, vdot(vsub(b.wall[s.T], b.wall[s.S]), t.dir));
    }
  }
  updatePeaks() {
    const b = this.body, p = this.peaks;
    if (!b.present()) return;
    if (this.cfg.exercise !== 'balance') for (const s of SIDES) {
      const v = this.sus2D[s.i].add(this.now, b.elev2D[s.i]);
      if (v != null) p.elev[s.i] = Math.max(p.elev[s.i] ?? 0, v);
    } else if (b.bodyLean != null) {
      const rel = b.bodyLean - this.baseLean, v = this.susLean.add(this.now, Math.abs(rel));
      if (v != null) { const i = rel < 0 ? 0 : 1; p.lean[i] = Math.max(p.lean[i] ?? 0, v); }
    }
  }

  spawn() {
    const c = this.cfg, p = c.preset, b = this.body, A = c.std.A;
    let side, place;
    if (c.exercise === 'balance' || c.arm === 'both') { place = this.alt; this.alt = this.alt === 'left' ? 'right' : 'left'; side = c.exercise === 'balance' ? null : place; }
    else { place = c.arm; side = c.arm; }
    const sd = SIDES.find(s => s.k === place);
    const arm = b.present() ? b.armLen : A;
    let anchor = b.valid(sd.S) ? b.wall[sd.S] : V(this.aspect / 2 + sd.out * c.std.half, c.std.shoulderY);
    let pos, dir = V(0, -1), meta = {};
    if (c.exercise === 'rom') {
      const [lo, hi] = p.arc, n = Math.max(2, Math.round((hi - lo) / 15) + 1);
      const k = pingPong(this.seq[sd.i]++, n), th = toRad(lo + (hi - lo) * k / (n - 1));
      dir = V(sd.out * Math.sin(th), Math.cos(th));
      pos = vadd(anchor, vmul(dir, p.dist * arm));
      meta.angle = Math.round(lo + (hi - lo) * k / (n - 1));
    } else if (c.exercise === 'reach') {
      // Easy keeps to comfortable same-side directions (no straight-overhead flower).
      const ipsi = c.level === 'easy' ? (place === 'left' ? [9, 10.5, 7.5] : [3, 1.5, 4.5]) : (place === 'left' ? [9, 10.5, 12, 7.5] : [3, 1.5, 12, 4.5]);
      const cross = place === 'left' ? [1.5, 3, 4.5] : [10.5, 9, 7.5];
      let hours = ipsi.concat(p.cross ? cross : []);
      const startH = place === 'left' ? 7.5 : 4.5;

      E.make({ x: t.pos.x, y: t.pos.y, count: 70, kind: K.sparkle, life: 1.1, hue: t.core, speed: 0.5, size: 0.005, radius: t.radius * 0.2 }),
      E.make({ x: t.pos.x, y: t.pos.y, count: 140, kind: K.pollen, life: 2.4, hue: t.hue, hueRange: 0.2, speed: 0.18, size: 0.0035, radius: t.radius * 0.8 }));

    if (this.cfg.exercise !== 'balance' && completed && by && by.s) {

    }
  }

}

// =====================================================================================
// Sound: bell chimes (pentatonic, a melody across reps) and a slow ambient pad.
// =====================================================================================
class Sound {
  constructor() { this.ctx = null; this.melody = 0; }
  init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }   // play through the silent switch (Safari)
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor();
    this.master.connect(comp).connect(ctx.destination);
    this.bus = ctx.createGain();

    const conv = ctx.createConvolver(); conv.buffer = this.impulse(2.8, 2.4);
    const wet = ctx.createGain(); wet.gain.value = 0.45;
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.38;
    const fb = ctx.createGain(); fb.gain.value = 0.3;
    const dWet = ctx.createGain(); dWet.gain.value = 0.16;
    this.bus.connect(dry).connect(this.master);

    this.padGain.connect(this.bus);
    this.padGain.gain.setTargetAtTime(1, ctx.currentTime, 2);
    this.chords = [[73.42, 110, 146.83, 185, 220], [61.74, 92.5, 123.47, 146.83, 185], [49, 73.42, 98, 123.47, 146.83], [55, 82.41, 110, 146.83, 164.81]];

        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07 + k * 0.023;
        const lg = ctx.createGain(); lg.gain.value = h === 1 ? 0.005 : 0.001;

        this.padOsc.push({ o, k, h });
      }
    }

      ci = (ci + 1) % this.chords.length;
      const t = ctx.currentTime;
      for (const p of this.padOsc) p.o.frequency.setTargetAtTime(this.chords[ci][p.k] * p.h, t, 1.6);
    }, 14000);
  }
  duck(on) { if (this.padGain) this.padGain.gain.setTargetAtTime(on ? 0.3 : 1, this.ctx.currentTime, 0.6); }
  static note(i) { const pent = [0, 2, 4, 7, 9], oct = Math.floor(i / 5), d = ((i % 5) + 5) % 5; return 293.66 * Math.pow(2, (oct * 12 + pent[d]) / 12); }

    const ctx = this.ctx;

    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); out.connect(p).connect(this.bus); } else out.connect(this.bus);

    for (let k = 0; k < 5; k++) {

  spawn(pan) { this.bell(Sound.note(8 + Math.floor(Math.random() * 5)), 0.05, 0.45, pan); }
  tick(level, pan) { const m = this.line[this.melody % 16]; this.bell(Sound.note(m + 4 + level), 0.06, 0.3, pan); }
  complete(pan) {
    const m = this.line[this.melody++ % 16], N = Sound.note;
    this.bell(N(m + 5), 0.24, 1.0, pan); this.bell(N(m + 3), 0.13, 0.9, pan * 0.6, 0.02);
    this.bell(N(m), 0.1, 1.2, -pan * 0.3, 0.05); this.bell(N(m + 10), 0.05, 0.6, pan, 0.11);
  }
  miss(pan) { this.bell(Sound.note(-3), 0.06, 0.5, pan); this.bell(Sound.note(-5), 0.045, 0.6, pan, 0.16); }
  setComplete() { [0, 2, 4, 5, 7, 9].forEach((d, i) => this.bell(Sound.note(d + 3), 0.13, 1.1, i * 0.25 - 0.6, i * 0.11)); }
  sessionComplete() {
    [0, 2, 3, 5, 7, 8, 10, 12, 13, 15].forEach((d, i) => this.bell(Sound.note(d), 0.14, 1.4, Math.sin(i) * 0.6, i * 0.13));
    [0, 3, 5, 10].forEach(d => this.bell(Sound.note(d), 0.09, 2.2, 0, 1.45));
  }
  start() { [0, 3, 5].forEach((d, i) => this.bell(Sound.note(d + 2), 0.1, 1.2, (i - 1) * 0.4, i * 0.16)); }
}

// =====================================================================================
// Narrator: the device's own speech voices. Chinese is spoken only with a Cantonese voice
// (never a Mandarin one); without one, captions carry the instructions.
// =====================================================================================
class Narrator {
  constructor() {
    this.ok = 'speechSynthesis' in window; this.voices = { zh: null, en: null }; this.pending = 0;
    if (this.ok) { this.load(); speechSynthesis.addEventListener?.('voiceschanged', () => { this.load(); App.instance?.refreshVoiceNote(); }); }
  }
  load() {
    const vs = speechSynthesis.getVoices();
    const score = v => (v.localService ? 2 : 0) + (/premium|enhanced|natural|neural/i.test(v.name) ? 3 : 0) + (/compact/i.test(v.voiceURI) ? -1 : 0);
    const best = arr => arr.sort((a, b) => score(b) - score(a))[0] || null;
    this.voices.zh = best(vs.filter(v => /^(yue|zh[-_]hk)/i.test(v.lang)));
    this.voices.en = best(vs.filter(v => /^en[-_](gb|au|ie|nz|hk)/i.test(v.lang))) || best(vs.filter(v => /^en/i.test(v.lang)));
  }
  has(lang) { return !!this.voices[lang]; }
  unlock() { if (!this.ok) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { } }
  say(text, lang) {
    if (!this.ok || !text) return;
    const v = this.voices[lang];
    if (!v) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = lang === 'zh' ? 0.9 : 0.95;
    let fin = false;
    const done = () => { if (fin) return; fin = true; this.pending = Math.max(0, this.pending - 1); };
    u.onend = done; u.onerror = done;
    setTimeout(done, 1500 + text.length * (lang === 'zh' ? 330 : 95));   // some browsers drop onend
    this.pending++;
    speechSynthesis.speak(u);
  }
  stop() { if (this.ok) speechSynthesis.cancel(); this.pending = 0; }
  get speaking() { return this.pending > 0; }
}

// =====================================================================================
// Particles (simulated on the CPU): fireflies, pollen, petals, sparkles
// =====================================================================================
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, cc) => hash3(xi + a, yi + b, zi + cc);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v),
              lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w);
}

class Particles {
  constructor(cap, ff) {
    this.cap = cap; this.ff = ff; this.head = ff;
    const F = () => new Float32Array(cap);
    Object.assign(this, { x: F(), y: F(), vx: F(), vy: F(), life: F(), max: F(), size: F(), hue: F(), kind: F(), rot: F(), spin: F(), sd: F() });

    this.GX = 14; this.GY = 26; this.fx = new Float32Array(this.GX * this.GY); this.fy = new Float32Array(this.GX * this.GY); this.flowT = -1;
  }
  emit(e) {

      const i = this.ff + ((this.head - this.ff + n) % poolN);
      const ang = e.angle + (rnd() - 0.5) * e.spread, spd = e.speed * (0.3 + 0.7 * rnd());
      const rr = e.radius * Math.sqrt(rnd()), ra = rnd() * Math.PI * 2;
      this.x[i] = e.x + Math.cos(ra) * rr; this.y[i] = e.y + Math.sin(ra) * rr;
      this.vx[i] = e.vx + Math.cos(ang) * spd; this.vy[i] = e.vy + Math.sin(ang) * spd;
      const L = e.life * (0.55 + 0.45 * rnd()); this.life[i] = L; this.max[i] = L;
      this.size[i] = e.size * Math.max(0.2, 1 + (rnd() - 0.5) * 2 * e.sizeRange);
      this.hue[i] = e.hue + (rnd() - 0.5) * e.hueRange; this.kind[i] = e.kind;
      this.rot[i] = rnd() * 6.283; this.spin[i] = (rnd() - 0.5) * 7; this.sd[i] = rnd();
    }

  }
  flowField(t, aspect) {

    for (let gy = 0; gy < GY; gy++) for (let gx = 0; gx < GX; gx++) {

      const a = vnoise3(px, py + e, tt), b = vnoise3(px, py - e, tt), c = vnoise3(px + e, py, tt), d = vnoise3(px - e, py, tt);

    for (let i = 0; i < this.cap; i++) {

        this.x[i] = rnd() * aspect; this.y[i] = rnd() * 0.95; this.vx[i] = 0; this.vy[i] = 0; this.life[i] = L; this.max[i] = L;
        this.size[i] = 0.0014 + rnd() * 0.0024; this.hue[i] = rnd() < 0.3 ? 0.10 + rnd() * 0.05 : 0.48 + rnd() * 0.3; this.kind[i] = K.firefly; this.sd[i] = rnd();

      const fly = lerp(lerp(this.fy[k0], this.fy[k0 + 1], tx), lerp(this.fy[k0 + GX], this.fy[k0 + GX + 1], tx), ty);

      else if (kind === K.petal) { drag = 1.5; fl *= 1.6; vy += 0.035 * dt; vx += Math.sin(t * 2.3 + this.sd[i] * 37) * 0.03 * dt; }
      else if (kind === K.sparkle) { drag = 3.2; fl *= 0.5; }

        }

  }
}

// Renderer (WebGL2): sky & grass, light trails, glowing lines, flowers, particles, bloom.
// A port of the Mac app's Metal shaders.
// =====================================================================================
const GL_COMMON = `

    this.blend(true);
    u = this.full(this.P.copy); this.tex(0, this.trailA, u.uTex); gl.uniform1f(u.uGain, 1); gl.drawArrays(gl.TRIANGLES, 0, 3);
    this.lines(st.back);
    const nf = st.flowers.length / 16;

      const P = this.P.flower;
      this.upload(this.flowerVAO, st.flowers, nf);
      gl.useProgram(P.p); gl.uniform1f(P.u.uAspect, st.aspect); gl.uniform1f(P.u.uTime, st.time);
      gl.bindVertexArray(this.flowerVAO.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nf);
    }
    if (st.partCount) {
      const P = this.P.part;
      this.upload(this.partVAO, st.parts, st.partCount);
      gl.useProgram(P.p); gl.uniform1f(P.u.uAspect, st.aspect);
      gl.bindVertexArray(this.partVAO.vao); gl.drawArrays(gl.POINTS, 0, st.partCount);

    this.lines(st.front);
    // 3. bloom
    this.blend(false);

  }
}

  async loadPose(progress) {
    const vision = await import(MP_LIB);
    const fileset = await vision.FilesetResolver.forVisionTasks(MP_WASM);
    const res = await fetch(MP_MODEL);
    if (!res.ok) throw new Error('model ' + res.status);
    const total = +res.headers.get('content-length') || 5.8e6;
    const reader = res.body.getReader(); const chunks = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; progress(Math.min(1, got / total)); }
    const buf = new Uint8Array(got); let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
    const opts = { baseOptions: { modelAssetBuffer: buf, delegate: 'GPU' }, runningMode: 'VIDEO', numPoses: 2,
      minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5, outputSegmentationMasks: false };
    let lm;
    try { lm = await vision.PoseLandmarker.createFromOptions(fileset, opts); }
    catch (e) { console.warn('GPU delegate failed, using CPU', e); opts.baseOptions.delegate = 'CPU'; lm = await vision.PoseLandmarker.createFromOptions(fileset, opts); }
    // The first detection compiles GPU programs (seconds on a phone): do it now, behind the loading screen.
    const warm = document.createElement('canvas'); warm.width = 192; warm.height = 320;
    warm.getContext('2d').fillRect(0, 0, 192, 320);
    try { lm.detectForVideo(warm, performance.now()); } catch (e) { }
    return lm;
  }

  releaseWake() { try { this.lock?.release(); } catch (e) { } this.lock = null; }

  /// MediaPipe result → our joints in camera-proportional units, choosing the patient when two people are in view.
  poseFrame(res, t, vw, vh) {
    const camAspect = vw / vh, p = Array.from({ length: NJ }, () => V(0, 0)), c = new Array(NJ).fill(0);
    const poses = res?.landmarks || [];
    const frame = { time: t, p, c, people: poses.length, camAspect };
    if (!poses.length) return frame;
    let best = null, bestScore = -Infinity, bestC = null;
    for (const lm of poses) {
      const vis = i => (lm[i].visibility ?? 1) > 0.5;
      let sx = 0, sy = 0, n = 0, minX = 9, minY = 9, maxX = -9, maxY = -9;
      lm.forEach((q, i) => { if (!vis(i)) return; const x = q.x * camAspect, y = q.y; minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); if ([11, 12, 23, 24].includes(i)) { sx += x; sy += y; n++; } });
      if (!n) continue;
      const ctr = V(sx / n, sy / n), size = Math.hypot(maxX - minX, maxY - minY);
      const score = this.lastCenter && t - this.lastMatch < 1.5 ? -vdist(ctr, this.lastCenter) * 4 + size * 0.3 : size - vdist(ctr, V(camAspect / 2, 0.5)) * 0.8;
      if (score > bestScore) { bestScore = score; best = lm; bestC = ctr; }
    }
    if (!best) return frame;
    this.lastCenter = bestC; this.lastMatch = t;
    const P = i => V(best[i].x * camAspect, best[i].y);
    const C = i => { const q = best[i]; const inside = q.x > -0.02 && q.x < 1.02 && q.y > -0.02 && q.y < 1.02; return clamp(q.visibility ?? 0.9, 0, 1) * (inside ? 1 : 0.3); };
    const map = [[J.nose, 0], [J.lS, 11], [J.rS, 12], [J.lE, 13], [J.rE, 14], [J.lW, 15], [J.rW, 16], [J.lH, 23], [J.rH, 24], [J.lK, 25], [J.rK, 26], [J.lA, 27], [J.rA, 28]];
    for (const [j, i] of map) { p[j] = P(i); c[j] = C(i); }
    p[J.neck] = V((p[J.lS].x + p[J.rS].x) / 2, (p[J.lS].y + p[J.rS].y) / 2); c[J.neck] = Math.min(c[J.lS], c[J.rS]);
    for (const [tip, idx, w, e] of [[J.lT, 19, J.lW, J.lE], [J.rT, 20, J.rW, J.rE]]) {
      if (C(idx) > 0.5) { p[tip] = P(idx); c[tip] = C(idx); }
      else if (c[w] > 0.1 && c[e] > 0.1) { p[tip] = V(p[w].x + (p[w].x - p[e].x) * 0.42, p[w].y + (p[w].y - p[e].y) * 0.42); c[tip] = Math.min(c[w], c[e]) * 0.8; }
    }

  }
  /// The ?sim patient: stands in a fixed virtual camera and reaches for the real flowers.
  simFrame(t) {
    const camAspect = 9 / 16, aspect = this.aspect, c = this.game.cfg;
    const virt = new Framer().mapping(camAspect, aspect), real = this.framer.mapping(camAspect, aspect);
    const toCam = w => { const q = virt.toCam(w); return V((q.x - camAspect / 2) * this.simScale + camAspect / 2 + this.simShift * camAspect, (q.y - 0.5) * this.simScale + 0.5); };
    const fromCam = q => virt.toWall(V((q.x - this.simShift * camAspect - camAspect / 2) / this.simScale + camAspect / 2, (q.y - 0.5) / this.simScale + 0.5));
    const tg = this.game.targets.map(f => ({ ...f, pos: fromCam(real.toCam(f.pos)) }));
    const std = c.std;
    const w = this.simPatient.joints(t, tg, c.exercise, c.posture, std, aspect, this.game.baseLean || 0);
    return { time: t, p: w.map(q => { const k = toCam(q); return V(k.x + (Math.random() - 0.5) * 0.002, k.y + (Math.random() - 0.5) * 0.002); }), c: new Array(NJ).fill(0.9), people: 1, camAspect };
  }

  play() {

  // ------------------------------------------------------------- history, bests, garden
  streak() {
    const days = new Set(Store.data.sessions.map(s => dayKey(s.date)));
    let n = 0; const d = new Date();
    if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
    while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  bests(list = Store.data.sessions) {
    const b = { rom: [null, null], reach: [null, null], leanSit: [null, null], leanStand: [null, null] };
    const mx = (a, v) => v == null ? a : a == null ? v : Math.max(a, v);
    for (const s of list) {
      for (const i of [0, 1]) {
        if (s.exercise === 'rom') b.rom[i] = mx(b.rom[i], s.highest?.[i]);
        if (s.exercise === 'reach') b.reach[i] = mx(b.reach[i], s.reach?.[i]);
        if (s.exercise === 'balance') { const k = s.posture === 'sit' ? 'leanSit' : 'leanStand'; b[k][i] = mx(b[k][i], s.lean?.[i]); }
      }
    }
    return b;
  }
  buildGarden() {
    const t = tr(), list = Store.data.sessions;
    const days = new Set(list.map(s => dayKey(s.date)));
    const now = new Date(), dow = (now.getDay() + 6) % 7, monday = new Date(now); monday.setDate(now.getDate() - dow);
    let week = '', weekN = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const done = days.has(dayKey(d)); if (done) weekN += list.filter(s => dayKey(s.date) === dayKey(d)).length;
      week += `<div>${t.weekDays[i]}<i class="${done ? 'done' : ''} ${i === dow ? 'today' : ''}">${done ? '✿' : ''}</i></div>`;
    }
    const streak = this.streak();
    $('streakCard').innerHTML = `<div class="stat" style="border:0;padding-top:0"><span>${t.streak(streak)}</span><span>${t.thisWeek(weekN)}</span></div><div class="week">${week}</div>
      <p class="note" style="margin-top:10px">${t.totalFlowers(Store.data.garden.length)}</p>`;
    const b = this.bests(), rows = [];
    if (b.rom[0] != null) rows.push(t.bestRom(t.sideL, b.rom[0])); if (b.rom[1] != null) rows.push(t.bestRom(t.sideR, b.rom[1]));
    if (b.reach[0] != null) rows.push(t.bestReach(t.sideL, Math.round(b.reach[0]))); if (b.reach[1] != null) rows.push(t.bestReach(t.sideR, Math.round(b.reach[1])));
    for (const k of ['leanSit', 'leanStand']) for (const i of [0, 1]) if (b[k][i] != null) rows.push(`${t.posOpt[k === 'leanSit' ? 'sit' : 'stand']} · ${t.bestLean(i ? t.leanR : t.leanL, Math.round(b[k][i]))}`);
    $('bestCard').innerHTML = `<h3 style="font-size:16px;margin-bottom:6px">${t.best}</h3>` + (rows.length ? rows.map(r => `<div class="stat"><span>${r}</span><span></span></div>`).join('') : `<p class="note">—</p>`);
    $('histCard').innerHTML = `<h3 style="font-size:16px;margin-bottom:6px">${t.history}</h3>` + (list.length ? [...list].reverse().slice(0, 30).map(s => {
      const d = new Date(s.date);
      const when = d.toLocaleDateString(S.lang === 'zh' ? 'zh-HK' : 'en-GB', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(S.lang === 'zh' ? 'zh-HK' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
      return `<div class="h"><span>${when}<br><small style="color:var(--faint)">${t.ex[s.exercise][0]} · ${t.level[s.level]}</small></span><span>${s.completed}/${s.presented} ✿</span></div>`;
    }).join('') : `<p class="note">${t.noHistory}</p>`);
  }
  gardenLayout(aspect) {
    const list = Store.data.garden, out = [];
    const perRow = Math.max(7, Math.floor(aspect / 0.045));
    const shown = list.slice(-perRow * 12);
    shown.forEach((f, k) => {
      const row = Math.floor(k / perRow), col = k % perRow, sd = f.s ?? hashf(k);

  }
  buildSummary(rec) {

  historyText() {

  // ------------------------------------------------------------- frame

  /// One frame of tracking, game and drawing (tests call this directly with simulated time).

      if (c) {

      else if (this.ftAvg < 15 && this.scale < this.maxScale) this.scale = Math.min(this.maxScale, this.scale * 1.08);

  }

  updateHUD(now, dt) {

    for (const s of SIDES) if (this.body.tipValid(s) && this.body.wall[s.T].y < 0.22) blocked = true;

  // ------------------------------------------------------------- scene
  buildScene(now, dt) {
    const g = this.game, b = this.body, aspect = this.aspect, H = this.canvas.height;
    const st = { time: now % 10000, dt, aspect, trailDecay: 0.951, trail: [], back: [], front: [], flowers: [], parts: this.particles.out, partCount: 0 };
    const Ln = (arr, p0, p1, w, gl, k, hue, sat = 0.8, hard = 0) => arr.push(p0.x, p0.y, p1.x, p1.y, w, gl, k, hue, sat, hard);

        Ln(st.front, p, p, 0.007 * Math.max(scaleK, 0.7), 0.03 * Math.max(scaleK, 0.7), 1.1, hue, 0.55);

        if (b.valid(J.nose)) Ln(st.trail, b.pred[J.nose], b.pred[J.nose], 0.03 * Math.max(scaleK, 0.6), 0.05, 0.004, 0.68, 0.5);

  lantern(st, pv, l, a, hands, now, Ln) {
    const mid = V((pv.x + l.x) / 2, (pv.y + l.y) / 2 + 0.02), flick = 0.85 + 0.15 * Math.sin(now * 11) * Math.sin(now * 3.7);
    Ln(st.back, pv, mid, 0.003, 0.016, 0.35 * a, 0.12, 0.6); Ln(st.back, mid, l, 0.003, 0.016, 0.4 * a, 0.12, 0.6);

  }
  /// A figure of light: soft body, faint inner skeleton; interactive = the demo ghost (hand lights, trails, shimmer).
  figure(st, j, a, working, sitting, interactive, dt, hands, Ln, std) {
    const hue = 0.11, k = Math.max(std.A / 0.3, 0.55);
    const vol = (x, y, w, i) => Ln(st.back, x, y, w * k, w * k * 2.2, i * a, hue, 0.28);
    const ms = V((j[J.lS].x + j[J.rS].x) / 2, (j[J.lS].y + j[J.rS].y) / 2), mh = V((j[J.lH].x + j[J.rH].x) / 2, (j[J.lH].y + j[J.rH].y) / 2);

    vol(V(j[J.lS].x + 0.016 * k, j[J.lS].y + 0.014 * k), V(j[J.lH].x + 0.004 * k, j[J.lH].y), 0.036, 0.075);
    vol(V(j[J.rS].x - 0.016 * k, j[J.rS].y + 0.014 * k), V(j[J.rH].x - 0.004 * k, j[J.rH].y), 0.036, 0.075);
    vol(V(ms.x, ms.y + 0.02 * k), mh, 0.04, 0.06); vol(j[J.lS], j[J.rS], 0.026, 0.08); vol(j[J.neck], head, 0.016, 0.09); vol(head, head, 0.04, 0.32);
    for (const s of SIDES) {
      const m = working === s.k ? 1.7 : 1;
      vol(j[s.S], j[s.E], 0.025, 0.12 * m); vol(j[s.E], j[s.W], 0.02, 0.12 * m); vol(j[s.W], j[s.T], 0.015, 0.13 * m);
      vol(j[s.H], j[s.K], 0.03, 0.09); vol(j[s.K], j[s.A], 0.024, 0.09);
    }
    if (sitting) {
      const c = V(mh.x, mh.y + 0.035 * k);
      const stool = (x, y) => Ln(st.back, x, y, 0.0035 * k, 0.012 * k, 0.22 * a, 0.47, 0.5);
      stool(V(c.x - 0.1 * k, c.y), V(c.x + 0.1 * k, c.y)); stool(V(c.x - 0.085 * k, c.y), V(c.x - 0.095 * k, Math.min(c.y + 0.25 * k, 0.99))); stool(V(c.x + 0.085 * k, c.y), V(c.x + 0.095 * k, Math.min(c.y + 0.25 * k, 0.99)));
    }
    for (const [x, y] of BONES.concat([[J.lS, J.lH], [J.rS, J.rH]])) Ln(st.back, j[x], j[y], 0.0014 * k, 0.004 * k, 0.09 * a, hue, 0.2);
    if (!interactive) return;

      const t = j[s.T];
      Ln(st.front, t, t, 0.008 * k, 0.03 * k, a, hue, 0.5);
      const q = this.ghostPrev[s.i];
      if (q) { const mv = clamp(vdist(t, q) / 0.012, 0, 1); if (mv > 0.02) Ln(st.trail, q, t, 0.0075 * k, 0.018, 0.45 * mv * a, hue, 0.6); }
      this.ghostPrev[s.i] = t;

      this.particles.emit(E.make({ x: lerp(j[x].x, j[y].x, f), y: lerp(j[x].y, j[y].y, f), count: 1, kind: K.pollen, life: 1.1, hue, hueRange: 0.12, speed: 0.015, size: 0.0026 }));

  positionGuide(st, now, dt, c, Ln) {

    const pulse = 0.5 + 0.5 * Math.sin(now * 2.2);
    const a = this.templateAlpha * (0.42 + 0.12 * pulse + 0.4 * this.templateGood);
    this.figure(st, j, a, null, c.posture === 'sit', false, dt, [], Ln, c.std);
    if (good && rnd() < dt * 25) { const p = j[Math.floor(rnd() * NJ)]; this.particles.emit(E.make({ x: p.x, y: p.y, count: 3, kind: K.sparkle, life: 0.8, hue: 0.12, speed: 0.06, size: 0.003 })); }
    const ms = V((j[J.lS].x + j[J.rS].x) / 2, (j[J.lS].y + j[J.rS].y) / 2), y = ms.y + 0.3 * c.std.A;

    const row = (x, dir) => { for (let i = 0; i < 3; i++) { const ph = (i + drift) / 3; chev(x + dir * ph * 0.09 * k, dir, Math.sin(ph * Math.PI)); } };
    const cx = ms.x;
    switch (this.position) {
      case 'moveLeft': row(cx - gap, -1); break;
      case 'moveRight': row(cx + gap, 1); break;
      case 'tooClose': case 'showFeet': row(cx - gap - 0.09 * k, 1); row(cx + gap + 0.09 * k, -1); break;
      case 'tooFar': row(cx - gap, -1); row(cx + gap, 1); break;
    }
  }
}
