<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Data</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { padding: 10px; width: 350px; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    th { background: #f0f0f0; }
    .action-btn { padding: 5px 10px; margin: 2px; cursor: pointer; }
    .edit-btn { background: #fbbc05; color: black; }
    .delete-btn { background: #ea4335; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; max-width: 500px; margin: 50px auto; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Team Data Management</h1>
  <a href="form.html">+ New Entry</a><br><br>
  
  <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterTable()">
  
  <table id="dataTable">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Name</th>
        <th>Department</th>
        <th>Item</th>
        <th>Quantity</th>
        <th>Remarks</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Entry</h2>
      <form id="editForm">
        <input type="hidden" name="action" value="update">
        <input type="hidden" name="rowIndex" id="rowIndex">
        
        <label>Name</label>
        <input type="text" name="Name" id="editName">
        
        <label>Department</label>
        <input type="text" name="Department" id="editDepartment">
        
        <label>Item</label>
        <input type="text" name="Item" id="editItem">
        
        <label>Quantity</label>
        <input type="number" name="Quantity" id="editQuantity">
        
        <label>Remarks</label>
        <input type="text" name="Remarks" id="editRemarks">
        
        <button type="submit">Save Changes</button>
        <button type="button" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwB5y2Yb9khESSPtI-LmWVnFL-mwf--SbZDOf7qn4r0g3bVCfOlowCSFaoSKVCje5yb/exec';
    const sheetId = '10xtwqq2IAha3qZ9OA0SC5qLB9YO3ly328onOoPcuNPA';

    async function loadData() {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Data!A:Z`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const tr = document.createElement('tr');
          tr.dataset.rowIndex = i + 1;   // Google Sheets row number

          row.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell || '';
            tr.appendChild(td);
          });

          // Action buttons
          const actionTd = document.createElement('td');
          actionTd.innerHTML = `
            <button class="action-btn edit-btn" onclick="editRow(this)">Edit</button>
            <button class="action-btn delete-btn" onclick="deleteRow(this)">Delete</button>
          `;
          tr.appendChild(actionTd);
          tbody.appendChild(tr);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function editRow(btn) {
      const tr = btn.parentElement.parentElement;
      const cells = tr.cells;
      document.getElementById('rowIndex').value = tr.dataset.rowIndex;
      
      document.getElementById('editName').value = cells[1].textContent;
      document.getElementById('editDepartment').value = cells[2].textContent;
      document.getElementById('editItem').value = cells[3].textContent;
      document.getElementById('editQuantity').value = cells[4].textContent;
      document.getElementById('editRemarks').value = cells[5].textContent;
      
      document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function deleteRow(btn) {
      if (!confirm("Delete this row permanently?")) return;
      
      const tr = btn.parentElement.parentElement;
      const rowIndex = tr.dataset.rowIndex;
      
      const formData = new FormData();
      formData.append('action', 'delete');
      formData.append('rowIndex', rowIndex);
      
      try {
        await fetch(scriptURL, { method: 'POST', body: formData });
        tr.remove();
      } catch (err) {
        alert("Delete failed");
      }
    }

    // Handle Edit Form Submit
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      try {
        await fetch(scriptURL, { method: 'POST', body: formData });
        closeModal();
        loadData();        // Refresh table
      } catch (err) {
        alert("Update failed");
      }
    });

    function filterTable() {
      const filter = document.getElementById('searchInput').value.toUpperCase();
      const rows = document.querySelectorAll('#dataTable tbody tr');
      rows.forEach(row => {
        row.style.display = row.textContent.toUpperCase().includes(filter) ? '' : 'none';
      });
    }

    window.onload = loadData;
  </script>
</body>
</html>
