<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physio Radiology Challenge</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --light: #ecf0f1;
            --secondary: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #game-container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .hidden { display: none; }

        #xray-display {
            max-width: 100%;
            height: 400px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: white;
            border-radius: 6px;
            transition: 0.2s;
        }

        button:hover {
            background: var(--primary);
            color: white;
        }

        .btn-home {
            margin-top: 15px;
            background: var(--secondary);
            color: white;
            border: none;
            width: 100%;
        }

        .btn-retry {
            margin-top: 20px;
            background: var(--success);
            color: white;
            border: none;
            width: 100%;
        }

        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        #next-btn {
            margin-top: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 30px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Clinical Radiology Challenge - Ankle & Foot</h1>
    
    <div id="start-screen">
        <p>Test your diagnostic skills. 10 Cases. 1 Timer.</p>
        <button onclick="startGame()">Start Challenge</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="stats-bar">
            <span>Case: <span id="q-num">1</span>/10</span>
            <span>Timer: <span id="timer">0</span>s</span>
        </div>
        
        <img id="xray-display" src="" alt="Clinical X-ray">
        
        <div id="options" class="options-grid"></div>

        <div id="feedback" class="hidden"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Case →</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Challenge Complete!</h2>
        <p>Your Score: <span id="final-score">0</span> / 10</p>
        <p>Total Time: <span id="final-time">0</span> seconds</p>
        
        <button class="btn-retry" onclick="location.reload()">Try Again</button>
<button class="btn-home" onclick="history.back()">← Go Back</button>
    </div>
</div>

<script>
    // --- DATABASE ---
    // You can expand this array to 10 items
    const questions = [
        {
            image: "AF1.png",
            options: ["Isolated lateral malleolar fracture (Weber A)", "Bimalleolar ankle fracture (Weber B)", "Trimalleolar ankle fracture (Weber A)", "Trimalleolar ankle fracture (Weber B)"],
            correct: 3,
            explanation: "Trimalleolar ankle fracture. Lateral malleolar fracture at the level of the syndesmosis, in keeping with a Weber type B lateral malleolus fracture associated with a medial malleolar fracture at the tibial plafond level, and a posterior malleolar fracture (noticed as a cortical irregularity at the posterior articular surface of the distal tibia). Soft tissue oedema around the ankle. <br><br> Trimalleolar ankle fractures are inherently unstable and usually require surgical treatment."
        },
        {
            image: "AF2.png",
            options: ["Isolated lateral malleolar fracture (Weber A)", "Bimalleolar ankle fracture (Weber B)", "Talus fracture", "Navicular fracture"],
            correct: 0,
            explanation: "Transverse fracture of distal fibula / lateral malleolus at infrasyndesmotic location. Soft tissue swelling at lateral malleolus. Medial malleolus appears normal. Ankle mortise is intact. Suggestive of Weber A fracture."
        },
        {
            image: "AF3.png",
            options: ["Ankle anterior dislocation", "Spiral fracture proximal tibia", "Maisonneuve fracture", "Chonic ankle laxity"],
            correct: 2,
            explanation: "Limited views of the tibia/fibula and ankle show widening of the medial and tibiofibular clear spaces and a spiral fracture of the proximal fibula.<br><br>Widening of the medial clear space indicates a tear of the deltoid ligament while widening of the tibiofibular clear space indicates a tear of the distal tibiofibular syndesmosis. This combination of ligamentous injuries is often associated with a fibular fracture and if no fracture is present on an ankle series, the entire fibula should be imaged. The combination of a deltoid ligament tear (or its bony equivalent, avulsion of the medial malleolus), disruption of the ankle syndesmosis and a proximal fibular fracture is know as a Maisonneuve fracture."
        },
                {
            image: "AF4.png",
            options: ["Navicular fracture", "Talus collaspe", "Anterior ankle impingement", "Posterior ankle impingement"],
            correct: 2,
            explanation: "An anteromedial radiographic view with 30 degrees of external rotation of the same ankle demonstrated an osteophyte on the anteromedial aspect of the distal tibia.<br><br> Anterior ankle impingement can be due to scar tissue and inflammation or bone spurs that form in the anterior (front) of the ankle joint and limit range of motion and can cause pain. The classic form of impingement is referred to as (footballer's ankle.) Despite the name, this can happen in many different types of sports including soccer, football, basketball, and in dancers.<br><br>Chronic lateral ankle instability has also been hypothesized to contribute to the development of both bony and soft tissue lesions associated with anterior impingement due to abnormal repetitive micromotion."
        },
                {
            image: "AF5.png",
            options: ["Navicular fracture", "Talus collaspe", "Calcaneus fracture", "Normal"],
            correct: 0,
            explanation: "Intra-articular navicular fracture. Alignment within normal limits. <br><br>Navicular fractures are relatively uncommon, and when they do occur they tend to be avulsion or stress fractures. "
        },
                        {
            image: "AF6.png",
            options: ["# Base of fifth metatarsal", "Navicular fracture", "Calcaneus fracture", "Isolated lateral malleolar fracture (Weber A)"],
            correct: 2,
            explanation: "Fracture at calcaneum. Böhler's angle measure 22 degrees. No other fracture at other visualised bone. No joint dislocation. Bone density is normal. <br><br>A calcaneal fracture is a common fracture that involves the tarsal bone. Bohler angle is used for the assessment of calcaneal fracture. Bohler angle is taken on lateral foot radiograph, and the normal Bohler angle is between 25 to 40 degrees. "
        },
         {
            image: "AF7.png",
            options: ["# Base of fifth metatarsal", "Talus fracture", "Lisfranc injury", "No fracture detected"],
            correct: 2,
            explanation: "There is a divergent Lisfranc injury with lateral subluxation of the 2nd metatarsal base and an associated fracture at the base of the 3rd metatarsal. <br><br>Treatment for this type of unstable fracture-dislocation is often by percutaneous screw fixation if a good reduction has been achieved. Open reduction may be necessary if this is not the case."
        },
        {
            image: "AF8.png",
            options: ["Lateral malleolar fracture", "Medial malleolar fracture", "# 5th metatarsal styloid", "Navicular fracture"],
            correct: 2,
            explanation: "Avulsion fracture of the 5th metatarsal styloid process, which is minimally displaced and appears to extend to the articular surface. Calcaneal spur also is seen. <br><br>The Ottawa Ankle Rules (OAR) are a highly sensitive (>97-100%) clinical decision tool used to determine the need for radiographs in acute ankle or midfoot injuries, reducing unnecessary X-rays by 30-40%."
        },
                 {
            image: "AF9.png",
            options: ["Talus fracture", "Navicular fracture", "Calcaneus fracture", "No fracture detected"],
            correct: 0,
            explanation: "Undisplaced fracture of the lateral process of the talus.<br><br>Approximately half of all lateral talar process fractures are missed on X-ray. This oblique view of the lateral margin of the talus obtained in the mortise projection is often the best chance of identifying this injury."
        },
        {
            image: "AF10.jpg",
            options: ["Lisfranc injury", "# 5th metatarsal head", "Tuft fracture", "No fracture detected"],
            correct: 2,
            explanation: "Comminuted fracture of the phalangeal tuft of the 2nd and 3rd digit, not extending to the distal interphalangeal joint."
        },
    ];

    let currentQuestion = 0;
    let score = 0;
    let startTime;
    let timerInterval;

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTime = Date.now();
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer').innerText = elapsed;
        }, 1000);
    }

    function showQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('q-num').innerText = currentQuestion + 1;
        document.getElementById('xray-display').src = q.image;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(choice) {
        const q = questions[currentQuestion];
        const feedback = document.getElementById('feedback');
        const buttons = document.querySelectorAll('#options button');
        
        buttons.forEach(b => b.disabled = true);
        
        feedback.classList.remove('hidden');
        if(choice === q.correct) {
            score++;
            feedback.innerHTML = `<strong>Correct!</strong><br>${q.explanation}`;
            feedback.className = "correct";
        } else {
            feedback.innerHTML = `<strong>Incorrect.</strong><br>Correct answer: ${q.options[q.correct]}<br>${q.explanation}`;
            feedback.className = "wrong";
        }
        
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestion++;
        if(currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-time').innerText = Math.floor((Date.now() - startTime) / 1000);
    }
</script>

</body>
</html>
